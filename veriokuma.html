<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var ad, soyad, yas;
        ad = prompt("Adınızı giriniz: ");
        soyad = prompt("Soyadınızı giriniz: ");
        yas = prompt("Yaşınızı giriniz: ");
        document.write("Adınız: " + ad + "<br>");
        document.write("Soyadınız: " + soyad + "<br>");
        document.write("Yaşınız: " + yas + "<br>");
        alert("Adınız: " + ad + "\nSoyadınız: " + soyad + "\nYaşınız: " + yas);
        console.log("Adınız: " + ad);
        console.log("Soyadınız: " + soyad);
        console.log("Yaşınız: " + yas);
    </script>

</body>

</html>
