<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var fenerbahce = ["Fenerbahçe", "Sarı-Lacivert", 1907, true];
        console.log(`Takım Adı: ${fenerbahce[0]}`);
        console.log(`Renkler: ${fenerbahce[1]}`);
        console.log(`Kuruluş Yılı: ${fenerbahce[2]}`);
        console.log(`Şampiyonluk Durumu: ${fenerbahce[3] ? "Evet" : "Hayır"}`);
        console.log(`Dizi Uzunluğu: ${fenerbahce.length}`);

        var besiktas = new Array(4);
        besiktas[0] = "Beşiktaş";
        besiktas[1] = "Siyah-Beyaz";
        besiktas[2] = 1903;
        besiktas[3] = true;


        console.log(`Takım Adı: ${besiktas[0]}`);
        console.log(`Renkler: ${besiktas[1]}`);
        console.log(`Kuruluş Yılı: ${besiktas[2]}`);
        console.log(`Şampiyonluk Durumu: ${besiktas[3] ? "Evet" : "Hayır"}`);

    </script>

</body>

</html>
