        // Üç döngüyü aynı programda kullanarak bir sayının bölenlerini buluyoruz.
        var sayi = Number(prompt("Pozitif bir tam sayı girin:"));

        if (Number.isInteger(sayi) && sayi > 0) {
            var sonuc = "<h2>" + sayi + " sayısının bölenleri</h2><ul>";

            // for döngüsü, 1'den girilen sayıya kadar bütün adayları dener.
            for (var aday = 1; aday <= sayi; aday++) {
                var kalan = sayi;

                // while döngüsü, aday sayısını çıkararak tam bölünüp bölünmediğini kontrol eder.
                while (kalan >= aday) {
                    kalan -= aday;
                }

                if (kalan === 0) {
                    sonuc += "<li>" + aday + " sayısı, " + sayi + " sayısının bölenidir.</li>";
                }
            }

            sonuc += "</ul>";
            var tekrar;

            // do-while döngüsü, sonuç ekranını en az bir kez gösterir ve kullanıcı isterse tekrarlar.
            do {
                document.body.innerHTML = sonuc;
                tekrar = prompt("Sonuç gösterildi. Programı tekrar çalıştırmak ister misiniz? (evet/hayır)");
            } while (tekrar && tekrar.toLowerCase() === "evet");
        } else {
            document.write("Lütfen pozitif bir tam sayı girin.");
        }

        </script>
