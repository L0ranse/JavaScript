        class Daire {
            constructor(yariCap) {
                this.yariCap = yariCap;
            }

            alanHesapla() {
                return Math.PI * this.yariCap * this.yariCap;
            }

            cevreHesapla() {
                return 2 * Math.PI * this.yariCap;
            }
        }

        const daire1 = new Daire(5);
        console.log(`Dairenin alanı: ${daire1.alanHesapla()}`);
        console.log(`Dairenin çevresi: ${daire1.cevreHesapla()}`);



        const daire2 = new Daire(parseFloat(prompt("Lütfen dairenin yarıçapını girin:")));
        console.log(`Dairenin alanı: ${daire2.alanHesapla()}`);
        console.log(`Dairenin çevresi: ${daire2.cevreHesapla()}`);
        console.log(`Dairenin yarıçapı: ${daire2.yariCap}`);
        console.log(`Dairenin alanı: ${daire2.alanHesapla()}`);
