<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var sayi1, sayi2, buyuk;
        sayi1 = Number(prompt("Birinci sayıyı giriniz:"));
        sayi2 = Number(prompt("İkinci sayıyı giriniz:"));
        if (sayi1 > sayi2) {
            buyuk = sayi1;
        } else {
            buyuk = sayi2;
        }
        
        alert("Girdiğiniz iki sayıdan büyüğü: " + buyuk);
        document.write("Girdiğiniz iki sayıdan büyüğü: " + buyuk);
    </script>

</body>

</html>
