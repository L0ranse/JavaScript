<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var ad = prompt("Lütfen adınızı giriniz:");
        var soyad = prompt("Lütfen soyadınızı giriniz:");

        alert("Adınız: " + ad + "\nSoyadınız: " + soyad);
        document.write("Ad: " + ad + "<br>");
        document.write("Soyad: " + soyad + "<br>");
    </script>

</body>

</html>
