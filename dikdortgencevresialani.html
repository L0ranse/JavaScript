<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        //Önce değişkenlerimizi tanımlayalım
        var g, y, alan, cevre;

        //Değerleri okuyalım
        g = Number(prompt("Genişlik:"));
        y = Number(prompt("Yükseklik:"));

        //Dikdörtgen alanı ve çevresinin hesabı
        alan = g * y;
        cevre = 2 * (g + y);

        //İşlem sonucunu ekrana yazalım
        alert("Alan:" + alan + " Çevre:" + cevre);
    </script>
</body>

</html>
