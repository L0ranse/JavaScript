        console.log("Küpleri: " + kup(sayi1) + " ve " + kup(sayi2));

        console.log("Toplamları: " + toplam(sayi1, sayi2));
        console.log("Çıkarmaları: " + cikarma(sayi1, sayi2));
        console.log("Çarpımları: " + carpma(sayi1, sayi2));
        console.log("Bölümleri: " + bolme(sayi1, sayi2));
        console.log("Modları: " + mod(sayi1, sayi2));
        console.log("Kalan: " + kalan(sayi1, sayi2));
        console.log("Üsleri: " + usAlma(sayi1, sayi2));
        console.log("Ortalama: " + ortalama(sayi1, sayi2));
