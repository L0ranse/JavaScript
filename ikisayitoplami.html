<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        //Önce değişkenlerimizi tanımlayalım
        var s1, s2, toplam;

        //İlk sayıyı alıp s1'e atayalım
        s1 = Number(prompt("Birinci Sayı:"));

        //İkinci sayıyı alıp s2'ye atayalım
        s2 = Number(prompt("İkinci Sayı:"));

        //Sayıların toplamını hesaplayalım
        toplam = s1 + s2;

        //İşlem sonucunu ekrana yazalım
        alert("Sayıların toplamı: " + toplam);
    </script>
</body>

</html>
