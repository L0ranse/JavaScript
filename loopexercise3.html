        var sayi = Number(prompt("0'dan hangi sayıya kadar kontrol edilsin?"));
        var ilkSayi = 0;

        while (ilkSayi <= sayi) { // 0'dan belirtilen sayıya kadar olan sayılar arasından toplamı 12 olan sayı çiftlerini ekrana yazdıran bir while döngüsü
            var ikinciSayi = 0; // ikinci sayıyı sıfırdan başlatıyoruz çünkü her bir ilk sayı için ikinci sayıyı tekrar kontrol etmemiz gerekiyor

            while (ikinciSayi <= sayi) { // ikinci sayıyı sıfırdan belirtilen sayıya kadar kontrol ediyoruz
                if (ilkSayi + ikinciSayi === 12) { // eğer ilk sayı ile ikinci sayının toplamı 12 ise ekrana yazdırıyoruz
                    document.write(ilkSayi + " + " + ikinciSayi + " = 12<br>"); // ekrana yazdırma işlemi
                }
                ikinciSayi++; // ikinci sayıyı bir artırıyoruz
            }

            ilkSayi++; // ilk sayıyı bir artırıyoruz
        }

    </script>
