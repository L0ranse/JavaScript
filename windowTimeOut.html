<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        function showAlert() {
            alert("10 saniye geçti! Maalesef, zaman doldu.");
        }
        setTimeout(showAlert, 10000);
        var name = prompt("Lütfen adınızı girin:");
        if (name) {
            alert("Merhaba, " + name + "!");
        } else {
            alert("Adınızı girmediniz.");
        }
        var surname = prompt("Lütfen soyadınızı girin:");
        if (surname) {
            alert("Merhaba, " + surname + "!");
        } else {
            alert("Soyadınızı girmediniz.");
        }



    </script>

</body>

</html>
