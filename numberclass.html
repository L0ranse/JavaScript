<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
    const sayi = 23.456;
    // Sayı metne dönüştürüldükten sonra sayı metotları çağrılamaz.
    console.log(sayi.toString()); // string olarak yazdırır

    console.log(sayi.toExponential(2)); // 2 basamaklı üstel gösterim
    console.log(sayi.toFixed(2)); // 2 basamaklı ondalık gösterim
    console.log(sayi.toPrecision(4)); // 4 basamaklı gösterim
    console.log(sayi.toLocaleString("tr-TR")); // Türkçe formatta yazdırır
    
      

       

    </script>
</body>
