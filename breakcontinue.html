<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        // break ve continue kullanımı
        for (let i = 1; i <= 10; i++) {
            if (i === 5) {
                console.log("Döngü sayısı: " + i + " - Döngüden çıkılıyor (break)");
                break; // Döngüyü sonlandırır
            }
            if (i === 3) {
                console.log("Döngü sayısı: " + i + " - Bu sayıyı atlıyoruz (continue)");
                continue; // Bu iterasyonu atlar ve bir sonraki iterasyona geçer
            }
            console.log("Döngü sayısı: " + i);
        }
    </script>

</body>

</html>
