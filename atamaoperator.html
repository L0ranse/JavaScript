<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var a, b, c = 1;
        a = 5; // a değişkenine 5 değerini atadık
        b = Number(prompt("Lütfen bir sayı giriniz:")); // kullanıcıdan sayı alıyoruz
        a += 1; // a=a+1
        b -= 1; // b=b-1
        c *= a; // c=c*a


        document.write("a: " + a + " b: " + b + " c: " + c);
    </script>

</body>

</html>
