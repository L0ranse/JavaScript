<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        class ucgenHesaplama {
            constructor(kenar1, kenar2, kenar3) {
                this.kenar1 = kenar1;
                this.kenar2 = kenar2;
                this.kenar3 = kenar3;
            }

            cevreHesapla() {
                return this.kenar1 + this.kenar2 + this.kenar3;
            }

            alanHesapla() {
                const s = this.cevreHesapla() / 2;
                return Math.sqrt(s * (s - this.kenar1) * (s - this.kenar2) * (s - this.kenar3));
            }
        }

        const ucgen1 = new ucgenHesaplama(3, 4, 5);
        console.log(`Üçgenin çevresi: ${ucgen1.cevreHesapla()}`);
        console.log(`Üçgenin alanı: ${ucgen1.alanHesapla()}`);


        const ucgen2 = new ucgenHesaplama(
            parseFloat(prompt("Lütfen üçgenin birinci kenarını girin:")),
            parseFloat(prompt("Lütfen üçgenin ikinci kenarını girin:")),
            parseFloat(prompt("Lütfen üçgenin üçüncü kenarını girin:"))
        );
        console.log(`Üçgenin çevresi: ${ucgen2.cevreHesapla()}`);
        console.log(`Üçgenin alanı: ${ucgen2.alanHesapla()}`);
    </script>

</body>

</html>
