<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Dökümanı</title>
</head>

<body>
    <script>
        // document özellikleri
        document.write("Sayfa adresi: " + document.URL + "<br>"); // çıktı: Sayfa adresi: http://localhost:5500/document.html
        document.write("Sayfa başlığı: " + document.title + "<br>"); // çıktı: Sayfa başlığı: JavaScript Dökümanı
        document.write("Sayfa yazarı: " + document.author + "<br>"); // çıktı: Sayfa yazarı: undefined (author özelliği tanımlı değil)
        document.write("Sayfa açıklaması: " + document.description + "<br>"); // çıktı: Sayfa açıklaması: undefined (description özelliği tanımlı değil)
        document.write("Sayfa anahtar kelimeleri: " + document.keywords + "<br>"); // çıktı: Sayfa anahtar kelimeleri: undefined (keywords özelliği tanımlı değil)
        document.write("Sayfa dili: " + document.language + "<br>"); // çıktı: Sayfa dili: undefined (language özelliği tanımlı değil)
        document.write("Sayfa karakter seti: " + document.characterSet + "<br>"); // çıktı: Sayfa karakter seti: undefined (characterSet özelliği tanımlı değil)
        document.write("Sayfa oluşturulma tarihi: " + document.lastModified + "<br>"); // çıktı: Sayfa oluşturulma tarihi: undefined (lastModified özelliği tanımlı değil)
        document.write("Sayfa yönlendirme: " + document.referrer + "<br>"); // çıktı: Sayfa yönlendirme: undefined (referrer özelliği tanımlı değil)
        document.write("Sayfa görünümü: " + document.visibilityState + "<br>"); // çıktı: Sayfa görünümü: undefined (visibilityState özelliği tanımlı değil)
        document.write("Sayfa boyutu: " + document.body.clientWidth + "x" + document.body.clientHeight + "<br>"); // çıktı: Sayfa boyutu: 800x600 (örnek değerler)
        // document.documentElement.outerHTML tüm belgeyi yeniden yazdırarak çıktının tekrarlanmasına neden olur.
        document.write("Sayfa başlığı uzunluğu: " + document.title.length + "<br>"); // çıktı: Sayfa başlığı uzunluğu: 21 (JavaScript Dökümanı başlığının karakter sayısı)
        document.write("Sayfa başlığı büyük harf: " + document.title.toUpperCase() + "<br>"); // çıktı: Sayfa başlığı büyük harf: JAVASCRIPT DÖKÜMANI
        document.write("Sayfa başlığı küçük harf: " + document.title.toLowerCase() + "<br>"); // çıktı: Sayfa başlığı küçük harf: javascript dökümanı
        document.write("Sayfa başlığı ilk harf büyük: " + document.title.charAt(0).toUpperCase() + document.title.slice(1) + "<br>"); // çıktı: Sayfa başlığı ilk harf büyük: JavaScript Dökümanı
        document.write("Sayfa başlığı ilk harf küçük: " + document.title.charAt(0).toLowerCase() + document.title.slice(1) + "<br>"); // çıktı: Sayfa başlığı ilk harf küçük: javascript Dökümanı
    </script>

</body>

</html>
