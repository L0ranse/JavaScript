<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var yas = Number(prompt("Yaşınızı giriniz:"));
        if (yas < 18) {
            alert("Reşit değilsiniz.");
        } else {
            alert("Reşitsiniz.");
        }
        document.write("Yaşınız: " + yas);
        document.write("<br>");
        document.write("Reşitlik Durumu: " + (yas < 18 ? "Reşit değilsiniz." : "Reşitsiniz."));
        document.write("<br>");
        document.write("Sitemize hoşgeldiniz.");
    </script>

</body>

</html>
