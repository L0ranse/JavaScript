<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        //Önce değişkenlerimizi tanımlayalım
        var sayi, kare;

        //Kullanıcıdan sayıyı alıp sayı değişkenine atayalım
        sayi = prompt("Sayı giriniz:");

        //Sayının karesini hesaplayalım
        kare = sayi * sayi;

        //İşlem sonucunu ekrana yazalım
        alert("Sayının karesi: " + kare);
    </script>

</body>

</html>
