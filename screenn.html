<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        document.write("Ekran Genişliği: " + screen.width + "<br>");
        document.write("Ekran Yüksekliği: " + screen.height + "<br>");
        document.write("Renk Derinliği: " + screen.colorDepth + "<br>");
        document.write("Açıklık Derinliği: " + screen.pixelDepth + "<br>");
        document.write("Ekran Boyutu: " + screen.availWidth + " x " + screen.availHeight + "<br>");
        document.write("Ekran Konumu: " + screen.availLeft + ", " + screen.availTop + "<br>");
        document.write("Ekran Çözünürlüğü: " + screen.width + " x " + screen.height + "<br>");
        document.write("Ekran Renk Modu: " + screen.colorDepth + " bit<br>");
        document.write("Ekran Yenileme Hızı: " + screen.refreshRate + " Hz<br>");
        document.write("Ekran Boyutu (inç): " + screen.width / 96 + " x " + screen.height / 96 + "<br>");
        document.write("Ekran Boyutu (cm): " + screen.width / 37.7952755906 + " x " + screen.height / 37.7952755906 + "<br>");
        document.write("Ekran Boyutu (mm): " + screen.width / 3.77952755906 + " x " + screen.height / 3.77952755906 + "<br>");
        document.write("Ekran Boyutu (px): " + screen.width + " x " + screen.height + "<br>");
        document.write("Ekran Boyutu (pt): " + screen.width / 1.33333333333 + " x " + screen.height / 1.33333333333 + "<br>");
        document.write("Ekran Boyutu (pc): " + screen.width / 16 + " x " + screen.height / 16 + "<br>");
        document.write("Ekran Boyutu (em): " + screen.width / 16 + " x " + screen.height / 16 + "<br>");
        document.write("Ekran Boyutu (rem): " + screen.width / 16 + " x " + screen.height / 16 + "<br>");
        document.write("Ekran Boyutu (vw): " + screen.width / 100 + " x " + screen.height / 100 + "<br>");
        document.write("Ekran Boyutu (vh): " + screen.width / 100 + " x " + screen.height / 100 + "<br>");
        document.write("Ekran Boyutu (vmin): " + screen.width / 100 + " x " + screen.height / 100 + "<br>");
        document.write("Ekran Boyutu (vmax): " + screen.width / 100 + " x " + screen.height / 100 + "<br>");
        document.write("Ekran Boyutu (ch): " + screen.width / 8 + " x " + screen.height / 8 + "<br>");
    </script>

</body>

</html>
