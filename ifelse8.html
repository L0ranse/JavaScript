<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var sayi1, sayi2;
        sayi1 = Number(prompt("Birinci sayıyı giriniz:"));
        sayi2 = Number(prompt("İkinci sayıyı giriniz:"));

        if (sayi1 > sayi2) {
            document.write(sayi1 + " > " + sayi2);
        } else if (sayi1 < sayi2) {
            document.write(sayi2 + " > " + sayi1);
        } else {
            document.write(sayi1 + " = " + sayi2);
        }
    </script>

</body>

</html>
