<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        let i = 0;
        while (i < 5) { // 0'dan 5'e kadar olan sayıları ekrana yazdıran bir while döngüsü (5 olunca döngü durur)
            console.log("Sayı: " + i);
            i++;
        }

        let j = 0;
        while (j < 5) { // 0'dan 5'e kadar olan sayıları ekrana yazdıran bir while döngüsü (5 olunca döngü durur)
            console.log("Sayı: " + j);
            j++;
        }

        let k = 0;
        while (k < 5) { // 0'dan 5'e kadar olan sayıları ekrana yazdıran bir while döngüsü (5 olunca döngü durur)
            console.log("Merhaba, bu bir while döngüsüdür. Sayı: " + k);
            k++;
        }
    </script>

</body>

</html>
