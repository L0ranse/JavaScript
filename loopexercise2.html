        // Sıfırdan belirtilen sayıya kadar olan sayılar toplamını ekrana yazdıran bir for döngüsü
        var sayac = Number(prompt("1'den kaç sayıya kadar olan sayıların toplamını görmek istiyorsunuz?"));
        var toplam = 0;
        for (let i = 1; i <= sayac; i++) {
            toplam += i;
            console.log("Döngü sayısı: " + i);
            // alert("Döngü sayısı: " + i);
            document.write("Döngü sayısı: " + i + "<br>");
        }
        console.log("Döngü tamamlandı! Toplam: " + toplam);
        // alert("Döngü tamamlandı! Toplam: " + toplam);
        document.write("Döngü tamamlandı! Toplam: " + toplam);
