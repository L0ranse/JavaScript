   /*
         * DO...WHILE ÖRNEĞİ: Sayı tahmin oyunu
         *
         * do...while döngüsü, önce do bloğundaki kodu çalıştırır,
         * ardından koşulu kontrol eder. Bu nedenle döngü en az bir kez çalışır.
         */
        const gizliSayi = Math.floor(Math.random() * 10) + 1;
        let tahmin;
        let denemeSayisi = 0;

        do {
            // prompt metin döndürür; Number() ile sayıya dönüştürüyoruz.
            tahmin = Number(prompt("1 ile 10 arasında bir sayı tahmin edin:"));

            // Geçersiz girişte döngü yeniden başlar.
            if (!Number.isInteger(tahmin) || tahmin < 1 || tahmin > 10) {
                alert("Lütfen 1 ile 10 arasında tam bir sayı girin.");
                continue;
            }

            denemeSayisi++;

            if (tahmin < gizliSayi) {
                alert("Daha büyük bir sayı deneyin.");
            } else if (tahmin > gizliSayi) {
                alert("Daha küçük bir sayı deneyin.");
            }

            // Koşul, do bloğundan sonra kontrol edilir.
        } while (tahmin !== gizliSayi);

        // Koşul false olduğunda, yani doğru tahmin yapıldığında döngü biter.
        alert("Tebrikler! " + denemeSayisi + ". denemede doğru bildiniz.");
        document.write("<h2>Sayı tahmin oyunu tamamlandı!</h2>");
        document.write("Gizli sayı: " + gizliSayi + "<br>");
        document.write("Deneme sayınız: " + denemeSayisi);
        

    </script>
