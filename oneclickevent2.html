<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <h1 id="id1" onclick="this.innerHTML='Tıklandı!'" onmousemove="this.style.backgroundColor='lightgray'"
        onmouseout="this.style.backgroundColor='white'">Başlık Metni</h1>
    <button onclick="document.getElementById('id1').style.color='red'">Tıkla</button>
    <script>
        alert("Sayfa yüklendi");
        console.log("Sayfa yüklendi");
    </script>

</body>

</html>
