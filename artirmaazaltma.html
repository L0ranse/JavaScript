<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        // Artırma ve Azaltma Operatörleri
        // Artırma Operatörü (Increment Operator)
        var a = 10;
        document.write("Başlangıç değeri: " + a + "<br>");
        a++; // a'yı 1 artırır
        document.write("Artırma sonrası değeri: " + a + "<br>");

        // Azaltma Operatörü (Decrement Operator)
        var b = 5;
        document.write("Başlangıç değeri: " + b + "<br>");
        b--; // b'yi 1 azaltır
        document.write("Azaltma sonrası değeri: " + b + "<br>");

        // Önce artırma sonra yazdırma (Post-increment)
        var c = 3;
        document.write("Başlangıç değeri: " + c + "<br>");
        document.write("Artırma sonrası değeri (post-increment): " + c++ + "<br>");
        document.write("Artırma sonrası değeri (sonraki değer): " + c + "<br>");

        // Önce azaltma sonra yazdırma (Post-decrement)
        var d = 7;
        document.write("Başlangıç değeri: " + d + "<br>");
        document.write("Azaltma sonrası değeri (post-decrement): " + d-- + "<br>");
        document.write("Azaltma sonrası değeri (sonraki değer): " + d + "<br>");

    </script>

</body>

</html>
