<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        //önce değişkenlerimizi tanımlayalım
        var s1, s2, s3, ortalama;

        //Sayıları okuyalım
        s1 = Number(prompt("Birinci Sayı:"));
        s2 = Number(prompt("İkinci Sayı:"));
        s3 = Number(prompt("Üçüncü Sayı:"));

        //Sayıların ortalamasını hesaplayalım
        ortalama = ((s1 + s2 + s3) / 3);

        //İşlem sonucunu ekrana yazalım
        alert("Sayıların ortalaması:" + ortalama);
    </script>
</body>

</html>
