<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Örnek</title>
</head>

<body>
    <script>
        var sayi1 = 10;
        var sayi2 = 20;
        var toplam = sayi1 + sayi2;
        document.write("Sayı 1: " + sayi1 + "<br>");
        document.write("Sayı 2: " + sayi2 + "<br>");
        document.write("Toplam: " + toplam + "<br>");
        // sayısal toplama
        var ad, soyad, yas;
        ad = prompt("Adınızı giriniz: ");
        soyad = prompt("Soyadınızı giriniz: ");
        yas = prompt("Yaşınızı giriniz: ");
        document.write("Ad: " + ad + " Soyad: " + soyad + " Yaş: " + yas + "<br>");
        // sözel toplama
    </script>

</body>

</html>
